YAML

name: Jacket Deals Tracke

'on':
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run jacket tracker
        run: python main.py
